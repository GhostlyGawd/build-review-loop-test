name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hosted-integration-no-live-auth:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      POWERSHELL_TELEMETRY_OPTOUT: "1"
      POWERSHELL_UPDATECHECK: "Off"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install frozen PowerShell host
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP 'PowerShell-7.6.2-win-x64.zip'
          $destinationPath = 'C:\Users\rhenm\AppData\Local\pwsh7'
          Invoke-WebRequest -Uri 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.2/PowerShell-7.6.2-win-x64.zip' -OutFile $archivePath

          $archiveSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
          if ($archiveSha256 -ne '32e0dd26752483ba3f0e40e9ae44150643cbff469c13210c93295d158bfd7b26') {
            throw "PowerShell archive SHA-256 mismatch: $archiveSha256"
          }

          if (Test-Path -LiteralPath $destinationPath) {
            throw "Frozen PowerShell destination already exists: $destinationPath"
          }
          New-Item -ItemType Directory -Path $destinationPath | Out-Null
          Expand-Archive -LiteralPath $archivePath -DestinationPath $destinationPath

          $pwshPath = Join-Path $destinationPath 'pwsh.exe'
          $pwshSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $pwshPath).Hash.ToLowerInvariant()
          if ($pwshSha256 -ne '99ec38d8c4910fd5f2feeeec4dedb5076ff39a08ca21e12642822bc8d989e316') {
            throw "PowerShell host SHA-256 mismatch: $pwshSha256"
          }

          $pwshVersion = & $pwshPath -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if ($pwshVersion -ne '7.6.2') {
            throw "PowerShell host version mismatch: $pwshVersion"
          }
      - name: Install frozen Codex CLI without credentials
        run: |
          $codexPath = 'C:\Users\rhenm\.codex\plugins\.plugin-appserver\codex.exe'
          $codexDirectory = Split-Path -Parent $codexPath
          if (Test-Path -LiteralPath $codexPath) {
            throw "Frozen Codex CLI destination already exists: $codexPath"
          }
          New-Item -ItemType Directory -Force -Path $codexDirectory | Out-Null

          Invoke-WebRequest -Uri 'https://github.com/openai/codex/releases/download/rust-v0.145.0-alpha.18/codex-x86_64-pc-windows-msvc.exe' -OutFile $codexPath

          $codexSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $codexPath).Hash.ToLowerInvariant()
          if ($codexSha256 -ne '20d611ef1c9851f4da1cb4609beb6763904f72275cb91517b2400639ca1c28c4') {
            throw "Codex CLI SHA-256 mismatch: $codexSha256"
          }

          $codexVersion = & $codexPath --version
          if ($codexVersion -ne 'codex-cli 0.145.0-alpha.18') {
            throw "Codex CLI version mismatch: $codexVersion"
          }
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Validate frozen scaffold
        run: npm run validate:scaffold
      - name: Run credential-free protocol integration tests
        run: |
          $testNames = @(
            'rejects ignored builder contamination before model launch',
            'rejects private runtime inputs nested inside a builder before model launch',
            'rejects every schema-valid builder containment overlap before evidence or model launch',
            'rejects a junction-aliased builder workdir before model launch',
            'canonicalizes real Windows 8.3 aliases and rejects aliased private builder input before model launch',
            'rejects stale and malformed absolute role deadlines before evidence or model launch'
          )
          $testSource = Get-Content -Raw -LiteralPath 'scripts/validate-scaffold.test.mjs'
          foreach ($testName in $testNames) {
            $literal = 'it("' + $testName + '"'
            $count = ([regex]::Matches($testSource, [regex]::Escape($literal))).Count
            if ($count -ne 1) {
              throw "Expected exactly one literal $literal, found $count"
            }
          }

          $skipPattern = '^(?:rejects ignored builder contamination before model launch|rejects private runtime inputs nested inside a builder before model launch|rejects every schema-valid builder containment overlap before evidence or model launch|rejects a junction-aliased builder workdir before model launch|canonicalizes real Windows 8\.3 aliases and rejects aliased private builder input before model launch|rejects stale and malformed absolute role deadlines before evidence or model launch)$'
          node --test --test-skip-pattern $skipPattern scripts/validate-scaffold.test.mjs
      - name: Run public tests when implemented
        run: npm run test:public:if-implemented
      - name: Build
        run: npm run build
      - name: Record hosted integration boundary
        if: always()
        run: |
          @'
          ## Hosted integration boundary

          This credential-free hosted integration runs 49/55 protocol tests. It is **not** canonical `npm run check`, **not** the locked 55/55 protocol execution, and **not** F2 execution or evidence.

          The following live-auth-coupled tests are **NOT EXECUTED IN HOSTED CI**:

          - `rejects ignored builder contamination before model launch`
          - `rejects private runtime inputs nested inside a builder before model launch`
          - `rejects every schema-valid builder containment overlap before evidence or model launch`
          - `rejects a junction-aliased builder workdir before model launch`
          - `canonicalizes real Windows 8.3 aliases and rejects aliased private builder input before model launch`
          - `rejects stale and malformed absolute role deadlines before evidence or model launch`

          The sealed local F2/P/A/B/C evidence remains authoritative. See `experiment/preflight/final-lock-evidence.json` and its domain-separated aggregate.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
